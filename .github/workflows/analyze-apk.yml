name: Extract LanBridge Protocol

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JADX
        run: |
          curl -L --fail -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          unzip -q jadx.zip -d jadx

      - name: Decompile APK
        run: |
          rm -rf apk-analysis
          mkdir -p apk-analysis

          ./jadx/bin/jadx \
            --deobf \
            --show-bad-code \
            -d apk-analysis/decompiled \
            _workspace_outputs_MinecraftLANBridge-v1.1-debug.apk || true

      - name: Extract exact Android files
        run: |
          mkdir -p protocol-analysis

          find apk-analysis/decompiled -type f \
            -name 'HttpProxyServer.java' \
            -exec cp {} protocol-analysis/HttpProxyServer.java \;

          find apk-analysis/decompiled -type f \
            -name 'BridgeService.java' \
            -exec cp {} protocol-analysis/BridgeService.java \;

          find apk-analysis/decompiled -type f \
            -name 'BridgeConfig.java' \
            -exec cp {} protocol-analysis/BridgeConfig.java \;

      - name: Extract Forge discovery source
        run: |
          mkdir -p protocol-analysis/forge

          find forge-src -type f \
            -iname '*Discovery*.java' \
            -exec cp {} protocol-analysis/forge/ \; 2>/dev/null || true

          find forge-src -type f \
            -iname '*ProxyInstaller*.java' \
            -exec cp {} protocol-analysis/forge/ \; 2>/dev/null || true

      - name: Extract source JAR if needed
        run: |
          mkdir -p forge-src

          SOURCE_JAR="$(find . -type f \
            \( -name 'lanbridge-1.1.0-sources.jar' \
            -o -iname '*sources*.jar' \) \
            | head -n 1)"

          if [ -n "$SOURCE_JAR" ]; then
            unzip -oq "$SOURCE_JAR" -d forge-src
          fi

          find forge-src -type f \
            \( -iname '*Discovery*.java' \
            -o -iname '*ProxyInstaller*.java' \) \
            -exec cp {} protocol-analysis/forge/ \; \
            2>/dev/null || true

      - name: Make protocol search
        run: |
          grep -RniE \
            '__lanbridge_info|DiscoveryInfo|proxyPort|gameRelayPort|udpRelayPort|25580|25581|25565|HttpURLConnection|ServerSocket|bind|listen|all.?traffic' \
            protocol-analysis \
            > protocol-analysis/search-results.txt || true

      - name: Make file listing
        run: |
          find protocol-analysis -type f -print \
            | sort \
            > protocol-analysis/files.txt

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add protocol-analysis

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Extract LanBridge protocol implementation"
            git push
          fi
