name: Analyze LanBridge APK

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JADX
        run: |
          curl -L --fail -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          unzip -q jadx.zip -d jadx

      - name: Decompile APK
        run: |
          rm -rf apk-analysis
          mkdir -p apk-analysis
          ./jadx/bin/jadx --deobf --show-bad-code \
            -d apk-analysis/decompiled \
            _workspace_outputs_MinecraftLANBridge-v1.1-debug.apk || true

      - name: Extract targeted source
        run: |
          mkdir -p analysis-targets

          find apk-analysis/decompiled -type f \
            \( -name 'HttpProxyServer.java' \
            -o -name 'BridgeService.java' \
            -o -name 'BridgeConfig.java' \) \
            -exec sh -c 'for f; do echo "===== $f ====="; cat "$f"; echo; done' sh {} + \
            > analysis-targets/android-networking.txt

          grep -RniE \
            '__lanbridge_info|25580|25581|discovery|lanbridge' \
            apk-analysis/decompiled \
            > analysis-targets/android-network-search.txt || true

          find . -type f \
            \( -name '*.java' -o -name '*.kt' \) \
            ! -path './apk-analysis/*' \
            -exec grep -liE \
              '__lanbridge_info|25580|25581|discovery|lanbridge' {} \; \
            > analysis-targets/forge-network-files.txt || true

          while IFS= read -r f; do
            echo "===== $f ====="
            cat "$f"
            echo
          done < analysis-targets/forge-network-files.txt \
            > analysis-targets/forge-networking.txt || true

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-targets
          git diff --cached --quiet || git commit -m "Extract LanBridge networking sources"
          git push
