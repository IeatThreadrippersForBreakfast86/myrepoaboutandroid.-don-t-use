name: Extract LanBridge Methods

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JADX
        run: |
          curl -L --fail -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          unzip -q jadx.zip -d jadx

      - name: Decompile APK
        run: |
          rm -rf apk-analysis
          mkdir -p apk-analysis

          ./jadx/bin/jadx \
            --deobf \
            --show-bad-code \
            -d apk-analysis/decompiled \
            _workspace_outputs_MinecraftLANBridge-v1.1-debug.apk || true

      - name: Extract exact Android methods
        run: |
          mkdir -p method-analysis

          HTTP=$(find apk-analysis/decompiled -name 'HttpProxyServer.java' | head -n 1)
          SERVICE=$(find apk-analysis/decompiled -name 'BridgeService.java' | head -n 1)

          echo "HttpProxyServer: $HTTP"
          echo "BridgeService: $SERVICE"

          if [ -n "$HTTP" ]; then
            grep -n -A120 -B30 \
              -E 'serveDiscovery|__lanbridge_info|start\(' \
              "$HTTP" \
              > method-analysis/android-http-proxy.txt || true
          fi

          if [ -n "$SERVICE" ]; then
            grep -n -A120 -B30 \
              -E 'startBridge|HttpProxyServer|proxyPort|udpRelayPort' \
              "$SERVICE" \
              > method-analysis/android-bridge-service.txt || true
          fi

      - name: Extract Forge source
        run: |
          mkdir -p forge-src

          SOURCE_JAR=$(find . -type f \
            \( -name 'lanbridge-1.1.0-sources.jar' \
            -o -iname '*sources*.jar' \) \
            | head -n 1)

          echo "Source JAR: $SOURCE_JAR"

          if [ -n "$SOURCE_JAR" ]; then
            unzip -oq "$SOURCE_JAR" -d forge-src
          fi

      - name: Extract Forge discovery methods
        run: |
          mkdir -p method-analysis

          find forge-src -type f \
            \( -name '*.java' -o -name '*.kt' \) \
            -exec grep -liE \
              '__lanbridge_info|discover|DiscoveryInfo|proxyPort|gameRelayPort|udpRelayPort' \
              {} \; \
            > method-analysis/forge-files.txt || true

          while IFS= read -r FILE; do
            echo "===== $FILE ====="
            grep -n -A120 -B30 \
              -E '__lanbridge_info|discover|DiscoveryInfo|proxyPort|gameRelayPort|udpRelayPort' \
              "$FILE" || true
            echo
          done < method-analysis/forge-files.txt \
            > method-analysis/forge-discovery.txt

      - name: Show generated files
        run: |
          echo "===== FILES ====="
          find method-analysis -type f -maxdepth 1 -print

          echo "===== ANDROID DISCOVERY ====="
          cat method-analysis/android-http-proxy.txt || true

          echo "===== FORGE DISCOVERY ====="
          cat method-analysis/forge-discovery.txt || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add method-analysis

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Extract LanBridge discovery methods"
            git push
          fi
