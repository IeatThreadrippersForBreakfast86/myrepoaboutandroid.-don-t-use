name: Analyze LanBridge APK

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JADX
        run: |
          curl -L --fail -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          unzip -q jadx.zip -d jadx

      - name: Decompile APK
        run: |
          rm -rf apk-analysis
          mkdir -p apk-analysis
          ./jadx/bin/jadx --deobf --show-bad-code \
            -d apk-analysis/decompiled \
            _workspace_outputs_MinecraftLANBridge-v1.1-debug.apk || true

      - name: Extract APK information
        run: |
          unzip -l _workspace_outputs_MinecraftLANBridge-v1.1-debug.apk \
            > apk-analysis/apk-contents.txt

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-analysis
          git diff --cached --quiet || git commit -m "Analyze LanBridge APK"
          git push
