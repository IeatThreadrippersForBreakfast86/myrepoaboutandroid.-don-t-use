name: Build LanBridge Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find source JAR
        run: |
          set -e
          JAR=$(find . -type f -name 'lanbridge-1.1.0-sources.jar' | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Source JAR not found."
            find . -type f | head -200
            exit 1
          fi

          echo "Found: $JAR"
          echo "$JAR" > /tmp/source_jar

      - name: Extract source
        run: |
          set -e
          rm -rf patched-source
          mkdir -p patched-source

          unzip -oq "$(cat /tmp/source_jar)" -d patched-source

      - name: Find discovery source
        run: |
          set -e

          FILE=$(find patched-source \
            -type f \
            -name 'LanBridgeDiscovery.java' \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "LanBridgeDiscovery.java not found."
            find patched-source -type f | sort
            exit 1
          fi

          echo "Found: $FILE"
          echo "$FILE" > /tmp/discovery_file

      - name: Patch discovery
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(Path("/tmp/discovery_file").read_text().strip())
          text = path.read_text()

          old = """int base = ip & 0xFFFFFF00;
          for (int i = 1; i < 255; i++) {
              int candidate = base | i;"""

          new = """int base = ip & 0xFFFFFF00;
          for (int i = 1; i < 255; i++) {
              int candidate = base | i;"""

          if old in text:
              text = text.replace(old, new, 1)
              print("Located the existing /24 discovery implementation.")
          else:
              print("WARNING: exact /24 block was not found.")
              print("The source may use a different implementation.")

          path.write_text(text)
          PY

      - name: Save patched source
        run: |
          mkdir -p experimental

          cp "$(cat /tmp/discovery_file)" \
            experimental/LanBridgeDiscovery.java

          echo "===== RESULT ====="
          cat experimental/LanBridgeDiscovery.java

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add experimental

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prepare experimental LanBridge discovery patch"
            git push
          fi
